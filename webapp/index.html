<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Course Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F3EA;
    --card: #FFFDF7;
    --ink: #1B2A4A;
    --ink-soft: #3A4A6B;
    --mustard: #D9A02E;
    --stamp-red: #B0392C;
    --slate: #5C6470;
    --line: #D8D0BC;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 90px;
  }

  header {
    padding: 20px 16px 14px;
    border-bottom: 2px solid var(--ink);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stamp-red);
    font-weight: 600;
  }

  h1 {
    font-family: 'Zilla Slab', serif;
    font-size: 26px;
    font-weight: 700;
    margin: 4px 0 14px;
    letter-spacing: -0.01em;
  }

  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 7px 14px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }

  .tab.active {
    background: var(--ink);
    color: var(--paper);
  }

  main { padding: 18px 16px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  .stamp {
    position: absolute;
    top: 10px;
    right: -28px;
    background: var(--stamp-red);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 3px 32px;
    transform: rotate(28deg);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  .card-img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
    border-bottom: 1.5px solid var(--ink);
  }

  .card-body { padding: 16px 16px 14px; }

  .card-cat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 4px;
  }

  .card-title {
    font-family: 'Zilla Slab', serif;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 8px;
  }

  .card-meta {
    display: flex;
    gap: 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .card-meta span { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--ink); }

  .perf {
    border-top: 1.5px dashed var(--line);
    margin: 14px 0 0;
    position: relative;
  }
  .perf::before, .perf::after {
    content: '';
    position: absolute;
    top: -7px;
    width: 14px;
    height: 14px;
    background: var(--paper);
    border-radius: 50%;
    border: 1.5px solid var(--ink);
  }
  .perf::before { left: -23px; }
  .perf::after { right: -23px; }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 14px;
  }

  .price {
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
  }
  .price::before { content: '₹'; font-size: 15px; margin-right: 1px; }

  .view-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--mustard);
    text-transform: uppercase;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--slate);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  #detail {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 100;
    overflow-y: auto;
    display: none;
  }

  .detail-header {
    padding: 18px 16px 16px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .back-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    flex-shrink: 0;
    cursor: pointer;
  }

  .detail-body { padding: 20px 16px 100px; }

  .detail-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    display: block;
    margin-bottom: 16px;
  }

  .detail-cat {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--stamp-red);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .detail-title {
    font-family: 'Zilla Slab', serif;
    font-size: 25px;
    font-weight: 700;
    line-height: 1.25;
    margin: 0 0 18px;
  }

  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .fact {
    background: var(--card);
    padding: 12px 14px;
  }

  .fact-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 3px;
  }

  .fact-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
    margin: 22px 0 8px;
  }

  .desc {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink-soft);
    white-space: pre-wrap;
  }

  .cta-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 2px solid var(--ink);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    z-index: 101;
  }

  .cta-price { font-family: 'Zilla Slab', serif; font-weight: 700; font-size: 22px; }
  .cta-price::before { content: '₹'; font-size: 16px; margin-right: 1px; }

  .cta-btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    padding: 13px 22px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Batch Catalog</div>
  <h1 id="app-title">Course Store</h1>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div id="detail">
  <div class="detail-header">
    <div class="back-btn" onclick="closeDetail()">←</div>
  </div>
  <div class="detail-body" id="detail-body"></div>
  <div class="cta-bar">
    <div class="cta-price" id="detail-price"></div>
    <button class="cta-btn" id="contact-btn">Message to Purchase</button>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  if (tg && tg.initData) {
    fetch('/api/visit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData }),
    }).catch(() => {});
  }

  let COURSES = [];
  let OWNER_USERNAME = '';
  let activeCategory = 'All';

  async function load() {
    try {
      const [coursesRes, configRes] = await Promise.all([
        fetch('/api/courses'),
        fetch('/api/config'),
      ]);
      COURSES = await coursesRes.json();
      const config = await configRes.json();
      OWNER_USERNAME = config.owner_username || '';
      document.getElementById('app-title').textContent = config.app_title || 'Course Store';
      renderTabs();
      renderGrid();
    } catch (e) {
      document.getElementById('grid').innerHTML = '<div class="empty">Could not load courses. Please try again shortly.</div>';
    }
  }

  function renderTabs() {
    const categories = ['All', ...new Set(COURSES.map(c => c.category))];
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = categories.map(cat =>
      `<div class="tab ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat.replace(/'/g, "\\'")}')">${cat}</div>`
    ).join('');
  }

  function selectCategory(cat) {
    activeCategory = cat;
    renderTabs();
    renderGrid();
  }

  function imgSrc(c) {
    if (c.image_url) return c.image_url;
    if (c.has_image) return `/api/image/${c.id}`;
    return null;
  }

  function renderGrid() {
    const list = activeCategory === 'All' ? COURSES : COURSES.filter(c => c.category === activeCategory);
    const gridEl = document.getElementById('grid');
    if (!list.length) {
      gridEl.innerHTML = '<div class="empty">No courses in this category yet.</div>';
      return;
    }
    gridEl.innerHTML = list.map(c => `
      <div class="card" onclick="openDetail('${c.id}')">
        ${c.batch_start ? `<div class="stamp">${escapeHtml(c.batch_start)}</div>` : ''}
        ${imgSrc(c) ? `<img class="card-img" src="${imgSrc(c)}" alt="">` : ''}
        <div class="card-body">
          <div class="card-cat">${escapeHtml(c.category)}</div>
          <div class="card-title">${escapeHtml(c.name)}</div>
          <div class="card-meta">
            ${c.lecture_count ? `<div>${c.lecture_count} <span>lectures</span></div>` : ''}
            ${c.subjects ? `<div><span>${escapeHtml(c.subjects)}</span></div>` : ''}
          </div>
        </div>
        <div class="perf"></div>
        <div class="card-foot">
          <div class="price">${c.price}</div>
          <div class="view-btn">View Details →</div>
        </div>
      </div>
    `).join('');
  }

  function openDetail(id) {
    const c = COURSES.find(x => x.id === id);
    if (!c) return;
    document.getElementById('detail-body').innerHTML = `
      ${imgSrc(c) ? `<img class="detail-img" src="${imgSrc(c)}" alt="">` : ''}
      <div class="detail-cat">${escapeHtml(c.category)}</div>
      <div class="detail-title">${escapeHtml(c.name)}</div>
      <div class="facts">
        ${c.batch_start ? `<div class="fact"><div class="fact-label">Batch Starts</div><div class="fact-value">${escapeHtml(c.batch_start)}</div></div>` : ''}
        ${c.lecture_count ? `<div class="fact"><div class="fact-label">Lectures</div><div class="fact-value">${c.lecture_count}</div></div>` : ''}
      </div>
      ${c.subjects ? `<div class="section-label">Subjects Covered</div><div class="desc">${escapeHtml(c.subjects)}</div>` : ''}
      <div class="section-label">About This Batch</div>
      <div class="desc">${escapeHtml(c.description || 'No additional details provided.')}</div>
    `;
    document.getElementById('detail-price').textContent = c.price;
    document.getElementById('contact-btn').onclick = () => contactOwner(c.name);
    document.getElementById('detail').style.display = 'block';
    if (tg) tg.BackButton.show();
  }

  function closeDetail() {
    document.getElementById('detail').style.display = 'none';
    if (tg) tg.BackButton.hide();
  }

  function contactOwner(courseName) {
    if (!OWNER_USERNAME) return;
    const text = encodeURIComponent(`Hi, I'm interested in: ${courseName}`);
    const url = `https://t.me/${OWNER_USERNAME}?text=${text}`;
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(url);
    } else {
      window.open(url, '_blank');
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  if (tg) tg.BackButton.onClick(closeDetail);

  load();
</script>

</body>
</html>
